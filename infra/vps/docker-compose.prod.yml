# ============================================================
# Monburan — Produção (VPS)
# Sobe só o app (o banco é o PostgreSQL gerenciado na nuvem — a
# connection string vai no DB_CONNECTION do .env); nginx (host)
# faz proxy reverso para o app e serve TLS via certbot.
#
# Uso (na VPS, em /opt/monburan):
#   cp docker-compose.prod.yml docker-compose.yml
#   cp env.example .env        # preencher valores
#   docker compose up -d
# ============================================================
services:
  # Roda uma vez antes do app, como root, e passa os volumes para o usuário sem privilégios da imagem (UID 1654). Volumes
  # criados quando o app ainda rodava como root ficaram com dono root; sem isto o app não grava uploads, chaves nem evidências.
  volume-permissions:
    image: ghcr.io/rondineleg/monburan:latest
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1654:1654 /app/wwwroot/uploads /app/keys /app/App_Data/evidencias /app/logs && chmod 700 /app/keys /app/App_Data/evidencias"]
    volumes:
      - app_uploads:/app/wwwroot/uploads
      - app_keys:/app/keys
      - app_evidence:/app/App_Data/evidencias
      - app_logs:/app/logs
    network_mode: none
    restart: "no"

  app:
    image: ghcr.io/rondineleg/monburan:latest
    container_name: monburan-app
    restart: unless-stopped
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # A imagem roda sem root e escuta na 8080 (porta abaixo de 1024 exige root)
      - ASPNETCORE_URLS=http://+:8080
      # Banco PostgreSQL gerenciado (nuvem), no formato do Npgsql:
      # Host=...;Database=...;Username=...;Password=...;SSL Mode=Require
      - "ConnectionStrings__DefaultConnection=${DB_CONNECTION:?Defina DB_CONNECTION no .env (connection string do banco na nuvem)}"
      # Aplica migrations automaticamente no boot
      - APPLY_MIGRATIONS=true
      # JWT — obrigatório, a app falha no boot sem chave de assinatura
      - "Jwt__SigningKey=${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY no .env — gere com: openssl rand -base64 48}"
      # Base pública usada em links de e-mail (confirmação/reset)
      - "App__PublicBaseUrl=${APP_PUBLIC_BASE_URL:-https://monburan.com.br}"
      # E-mail via SMTP (Resend). Se Smtp:Host vazio, cai no SendGrid.
      - "Smtp__Host=${SMTP_HOST:-smtp.resend.com}"
      - "Smtp__Port=${SMTP_PORT:-465}"
      - "Smtp__User=${SMTP_USER:-resend}"
      - "Smtp__Password=${SMTP_PASSWORD:-}"
      - "Smtp__FromEmail=${SMTP_FROM_EMAIL:-noreply@monburan.com.br}"
      - "Smtp__FromName=${SMTP_FROM_NAME:-Monburan}"
      # Administradores por e-mail (separados por vírgula): valem só com o e-mail da conta CONFIRMADO. É assim que o primeiro
      # administrador aparece em produção (o usuário administrador do seed só existe em Development).
      - "Admin__Emails=${ADMIN_EMAILS:-}"
      # Administradores só abrem a administração com o 2FA ligado na conta. Em emergência (perdeu o aparelho e os códigos de
      # recuperação), REQUIRE_ADMIN_2FA=false reabre o acesso até a pessoa reconfigurar; depois volte para true.
      - "Security__RequireTwoFactorForAdmins=${REQUIRE_ADMIN_2FA:-true}"
      # Hosts aceitos (separados por ponto e vírgula). Em produção restrinja ao domínio, por exemplo
      # "monburan.com.br;www.monburan.com.br;127.0.0.1" (o 127.0.0.1 deixa o curl /health local funcionar).
      - "AllowedHosts=${ALLOWED_HOSTS:-*}"
      # Chaves de sessão (DataProtection) persistidas no volume app_keys: o deploy não desloga mais ninguém
      - "DataProtection__KeysPath=/app/keys"
      - "Evidence__StoragePath=/app/App_Data/evidencias"
    # Chaves dos provedores de IA (variáveis AI_KEY_*): ficam no arquivo ai-keys.env (chmod 600), fora do .env principal e
    # do repositório. O administrador cadastra cada provedor na tela "Provedores de IA" informando só o NOME da variável.
    # "required: false" exige Docker Compose 2.24+ (docker compose version); sem o arquivo o app sobe com a IA desligada.
    env_file:
      - path: ./ai-keys.env
        required: false
    volumes:
      - app_uploads:/app/wwwroot/uploads
      - app_keys:/app/keys
      # Imagens das sugestões de vaga (pasta privada, fora do wwwroot): sem o volume, recriar o contêiner apaga as imagens
      - app_evidence:/app/App_Data/evidencias
      # Logs do Serilog (arquivo diário, 7 dias de retenção): sobrevivem à recriação do contêiner
      - app_logs:/app/logs
    networks:
      - monburan-net
    # Só o nginx do host acessa (via 127.0.0.1:8080 -> container 8080)
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  app_uploads:
    driver: local
  app_keys:
    driver: local
  app_evidence:
    driver: local
  app_logs:
    driver: local

networks:
  monburan-net:
    driver: bridge
