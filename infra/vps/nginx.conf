# ============================================================
# Monburan — nginx (reverse proxy na VPS)
# HTTP (80) redireciona para HTTPS; HTTPS (443) faz proxy para o
# app Docker (127.0.0.1:8080) e resolve Blazor + WebSockets.
# Certificados gerados pelo certbot em /etc/letsencrypt.
# ============================================================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name monburan.com.br www.monburan.com.br;

    # Validação ACME do certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor principal (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monburan.com.br www.monburan.com.br;

    ssl_certificate     /etc/letsencrypt/live/monburan.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monburan.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads (currículos/anúncios) podem ser grandes
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSockets / SignalR (Blazor Server)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Buffers p/ streaming do Blazor
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
