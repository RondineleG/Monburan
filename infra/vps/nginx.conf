# ============================================================
# Monburan — nginx (reverse proxy na VPS)
# HTTP (80) redireciona para HTTPS; HTTPS (443) faz proxy para o
# app Docker (127.0.0.1:8080) e resolve Blazor + WebSockets.
# Certificados gerados pelo certbot em /etc/letsencrypt.
# ============================================================

# As três diretivas abaixo ficam DENTRO de cada server (e não no topo do arquivo, que é o contexto http): o nginx.conf principal de
# algumas distribuições (o do Debian 13, por exemplo) já define server_tokens em http, e repetir no mesmo contexto é erro.
#   server_tokens off          esconde a versão do nginx (o cabeçalho Server passa a dizer só "nginx")
#   client_header_timeout 15s  cabeçalho e corpo têm que chegar logo: segurar conexões abertas sem terminar o envio (slowloris)
#   client_body_timeout 30s    esgota o servidor

# Qualquer outro nome (acesso pelo IP, domínio de terceiros apontado para cá, varredura de robôs) é descartado sem resposta
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout   30s;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout   30s;

    # O servidor padrão do HTTPS também precisa de certificado (ssl_reject_handshake só existe a partir do nginx 1.19.4)
    ssl_certificate     /etc/letsencrypt/live/monburan.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monburan.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name monburan.com.br www.monburan.com.br;

    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout   30s;

    # Validação ACME do certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor principal (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monburan.com.br www.monburan.com.br;

    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout   30s;

    ssl_certificate     /etc/letsencrypt/live/monburan.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monburan.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads (currículos/anúncios) podem ser grandes
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Só o endereço que o nginx viu: o app usa esse cabeçalho para o limite de tentativas por IP e para o log, então um
        # X-Forwarded-For mandado pelo cliente não pode chegar até ele (o nginx é o único proxy na frente do app)
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSockets / SignalR (Blazor Server)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Buffers p/ streaming do Blazor
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
