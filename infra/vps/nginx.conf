# ============================================================
# Monburan — nginx (reverse proxy na VPS)
# HTTP (80) redireciona para HTTPS; HTTPS (443) faz proxy para o
# app Docker (127.0.0.1:8080) e resolve Blazor + WebSockets.
# Certificados gerados pelo certbot em /etc/letsencrypt.
# ============================================================

# As três diretivas abaixo ficam DENTRO de cada server (e não no topo do arquivo, que é o contexto http): o nginx.conf principal de
# algumas distribuições (o do Debian 13, por exemplo) já define server_tokens em http, e repetir no mesmo contexto é erro.
#   server_tokens off          esconde a versão do nginx (o cabeçalho Server passa a dizer só "nginx")
#   client_header_timeout 15s  cabeçalho e corpo têm que chegar logo: segurar conexões abertas sem terminar o envio (slowloris)
#   client_body_timeout 30s    esgota o servidor

# O token do link público de currículo (/curriculo/<token>) abre o currículo de quem o tiver: ele não pode ficar no log de
# acesso. O map troca o token por *** e o log_format usa o endereço mascarado no lugar de $request. Os dois ficam no contexto
# http (este arquivo é incluído lá); os nomes são próprios do Monburan para não colidir com o nginx.conf principal.
map $request_uri $monburan_loggable_uri {
    "~*^/curriculo/[^/?]+(?<rest>.*)$" "/curriculo/***$rest";
    default                             $request_uri;
}

log_format monburan_masked '$remote_addr - $remote_user [$time_local] "$request_method $monburan_loggable_uri $server_protocol" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Qualquer outro nome (acesso pelo IP, domínio de terceiros apontado para cá, varredura de robôs) é descartado sem resposta
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout   30s;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout   30s;

    # O servidor padrão do HTTPS também precisa de certificado (ssl_reject_handshake só existe a partir do nginx 1.19.4)
    ssl_certificate     /etc/letsencrypt/live/monburan.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monburan.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name monburan.com.br www.monburan.com.br;

    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout   30s;

    access_log /var/log/nginx/access.log monburan_masked;

    # Validação ACME do certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor principal (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monburan.com.br www.monburan.com.br;

    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout   30s;

    ssl_certificate     /etc/letsencrypt/live/monburan.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monburan.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Log de acesso com o token do link público de currículo mascarado (veja o map no topo)
    access_log /var/log/nginx/access.log monburan_masked;

    # Uploads (currículos/anúncios) podem ser grandes. As imagens de sugestão (até 15 MB por envio) vão pelo SignalR do
    # Blazor em pedaços, não num POST só, então este limite não as corta.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Só o endereço que o nginx viu: o app usa esse cabeçalho para o limite de tentativas por IP e para o log, então um
        # X-Forwarded-For mandado pelo cliente não pode chegar até ele (o nginx é o único proxy na frente do app)
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSockets / SignalR (Blazor Server)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Buffers p/ streaming do Blazor
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
