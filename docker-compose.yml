version: '3.8'

services:
  # PostgreSQL para desenvolvimento
  postgres:
    image: postgres:16-alpine
    container_name: monburan-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-monburan}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monburan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-monburan}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Aplicação Monburan
  app:
    build:
      context: .
      dockerfile: src/Monburan.Web/Dockerfile
    container_name: monburan-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-monburan};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      - SendGrid__ApiKey=${SENDGRID_API_KEY:-}
      - SendGrid__FromEmail=noreply@monburan.com.br
      - SendGrid__FromName=Monburan
      # Obrigatório — a app falha no boot sem chave de assinatura JWT.
      # Gere uma no .env com: openssl rand -base64 48
      - "Jwt__SigningKey=${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY no .env — gere com: openssl rand -base64 48}"
      # URL pública usada em links de e-mail (vazio = scheme/host da request)
      - "App__PublicBaseUrl=${APP_PUBLIC_BASE_URL:-}"
      # Administradores por e-mail (separados por vírgula): valem só com o e-mail da conta confirmado.
      - "Admin__Emails=${ADMIN_EMAILS:-}"
    # Chaves dos provedores de IA (AI_KEY_*) no arquivo ai-keys.env (veja infra/vps/ai-keys.env.example); sem ele a IA fica desligada.
    env_file:
      - path: ./ai-keys.env
        required: false
    ports:
      - "8080:80"
    volumes:
      - app_uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monburan-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local

networks:
  monburan-network:
    driver: bridge
