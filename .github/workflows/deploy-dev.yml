name: Deploy dev (homologação GearHost)

# Ambiente público de homologação: https://app-dev-monburan.gearhost.io, com banco próprio (Neon) e massa de demonstração.
# Cada push na dev (merge de PR) publica aqui, para testar antes de promover para a main. Não gera versão nem imagem:
# APK, iOS e Docker continuam publicando só na main.
on:
  push:
    branches: [ dev ]
    paths:
      - 'src/Monburan.Web/**'
      - 'src/Monburan.Web.Client/**'
      - 'src/Monburan.Core/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  # A hospedagem aceita até 100 MB por publicação
  MAX_PUBLISH_MB: 100

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ vars.DEV_APP_URL || 'https://app-dev-monburan.gearhost.io' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Portão rápido: não publica código que quebra os testes unitários
      - name: Testes unitários
        run: dotnet test tests/Monburan.UnitTests --configuration Release --verbosity minimal

      # Dependente do framework: o pacote autocontido passa de 160 MB e a hospedagem aceita até 100 MB. Exige o runtime
      # ASP.NET Core 10 no servidor (o /health/live do fim confere).
      - name: Publicar
        run: |
          dotnet publish src/Monburan.Web/Monburan.Web.csproj -c Release -o out \
            --self-contained false -p:DebugType=none -p:SatelliteResourceLanguages="pt-BR%3Ben"
          # Proxy de depuração do WebAssembly: só serve em Development
          rm -rf out/BlazorDebugProxy

      - name: Gerar web.config com as configurações do ambiente
        env:
          DB_CONNECTION: ${{ secrets.DEV_DB_CONNECTION }}
          JWT_SIGNING_KEY: ${{ secrets.DEV_JWT_SIGNING_KEY }}
          SEED_PASSWORD: ${{ secrets.DEV_SEED_PASSWORD }}
          APP_URL: ${{ vars.DEV_APP_URL || 'https://app-dev-monburan.gearhost.io' }}
        run: |
          for name in DB_CONNECTION JWT_SIGNING_KEY SEED_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Falta o secret DEV_${name} no environment dev"; exit 1; }
          done
          xml() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'; }
          host="${APP_URL#https://}"; host="${host%%/*}"
          # O web.config não é servido pelo IIS; os valores sensíveis ficam só nele, no servidor
          cat > out/web.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath="dotnet" arguments=".\Monburan.Web.dll" stdoutLogEnabled="false" stdoutLogFile=".\logs\stdout" hostingModel="outofprocess">
                  <environmentVariables>
                    <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Staging" />
                    <environmentVariable name="APPLY_MIGRATIONS" value="true" />
                    <environmentVariable name="ConnectionStrings__DefaultConnection" value="$(xml "$DB_CONNECTION")" />
                    <environmentVariable name="Jwt__SigningKey" value="$(xml "$JWT_SIGNING_KEY")" />
                    <environmentVariable name="App__PublicBaseUrl" value="$(xml "$APP_URL")" />
                    <environmentVariable name="AllowedHosts" value="$(xml "$host")" />
                    <environmentVariable name="DataProtection__KeysPath" value="App_Data\keys" />
                    <environmentVariable name="Security__RequireTwoFactorForAdmins" value="false" />
                    <environmentVariable name="Seed__DemoData" value="true" />
                    <environmentVariable name="Seed__DemoPassword" value="$(xml "$SEED_PASSWORD")" />
                  </environmentVariables>
                </aspNetCore>
              </system.webServer>
            </location>
          </configuration>
          EOF

      - name: Conferir o tamanho da publicação
        run: |
          size=$(du -sm out | cut -f1)
          echo "Publicação: ${size} MB (limite ${MAX_PUBLISH_MB} MB)"
          echo "### Publicação: ${size} MB de ${MAX_PUBLISH_MB} MB" >> "$GITHUB_STEP_SUMMARY"
          [ "$size" -le "$MAX_PUBLISH_MB" ] || { echo "::error::A publicação tem ${size} MB e passa do limite de ${MAX_PUBLISH_MB} MB"; exit 1; }

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # app_offline.htm tira o site do ar enquanto os arquivos são trocados (o IIS solta as DLLs em uso); dados do
      # servidor (App_Data com chaves e evidências, uploads e logs) nunca são apagados pelo espelhamento
      - name: Enviar por FTP
        env:
          FTP_HOST: ${{ secrets.DEV_FTP_HOST }}
          FTP_USER: ${{ secrets.DEV_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.DEV_FTP_PASSWORD }}
          FTP_DIR: ${{ vars.DEV_FTP_DIR || '/wwwroot' }}
        run: |
          printf '<!doctype html><meta charset="utf-8"><title>Atualizando</title><p>O Monburan está sendo atualizado. Volte em um minuto.</p>' > app_offline.htm
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp_run() {
            lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "set ftp:passive-mode true; set net:max-retries 3; set net:timeout 30; $1; bye"
          }
          lftp_run "cd $FTP_DIR; put app_offline.htm"
          sleep 10
          lftp_run "mirror --reverse --delete --parallel=4 --verbose=1 \
            --exclude-glob App_Data/ --exclude-glob logs/ --exclude-glob wwwroot/uploads/ --exclude-glob app_offline.htm \
            out $FTP_DIR"
          lftp_run "cd $FTP_DIR; rm -f app_offline.htm"

      # Primeira subida aplica migrations e o seed de demonstração: pode levar alguns minutos
      - name: Conferir /health/live
        env:
          APP_URL: ${{ vars.DEV_APP_URL || 'https://app-dev-monburan.gearhost.io' }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$APP_URL/health/live" || true)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::O site não respondeu 200 em /health/live. HTTP 500.31 indica que o servidor não tem o runtime ASP.NET Core 10."
          exit 1
