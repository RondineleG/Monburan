name: Android APK

# Gera o APK de instalação direta (release assinado) do app MAUI Blazor Hybrid.
#  - push na main: compila, assina, confere e publica a release "v<versão>" com o APK.
#    A versão vem do csproj (ApplicationDisplayVersion / ApplicationVersion): só publica
#    se a tag ainda não existe — para lançar uma nova versão, suba a versão no csproj.
#  - pull request para a main: ensaio completo (compila, assina, confere, mostra as notas),
#    sem criar release; o APK fica disponível como artefato do run.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/Monburan.Mobile/**'
      - 'src/Monburan.Mobile.Shared/**'
      - 'src/Monburan.Core/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/Monburan.Mobile/**'
      - 'src/Monburan.Mobile.Shared/**'
      - 'src/Monburan.Core/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write   # criar a tag e a release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CSPROJ: src/Monburan.Mobile/Monburan.Mobile.csproj

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 'secrets' não vale em `if:` de step — expõe como env no nível do job
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      PUBLISHING: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # Publicar sem keystore geraria um APK assinado com a chave de debug do runner, que muda a
    # cada execução (ninguém conseguiria atualizar por cima) — melhor falhar cedo e avisar.
    - name: Exigir keystore para publicar
      if: env.PUBLISHING == 'true' && env.HAS_KEYSTORE != 'true'
      run: |
        echo "::error::Faltam os secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_PASSWORD: sem eles o APK não pode ser assinado para release."
        exit 1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android

    - name: Ler a versão do csproj
      id: version
      run: |
        name="$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' "$CSPROJ" | tr -d '\r')"
        code="$(grep -oP '(?<=<ApplicationVersion>)[^<]+' "$CSPROJ" | tr -d '\r')"
        if [ -z "$name" ] || [ -z "$code" ]; then
          echo "::error::ApplicationDisplayVersion/ApplicationVersion não encontrados em $CSPROJ"
          exit 1
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "Versão do app: $name (versionCode $code)"

    - name: Preparar a keystore
      if: env.HAS_KEYSTORE == 'true'
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/monburan.keystore"

    - name: Publish APK (release)
      env:
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        args=(-f net10.0-android -c Release -p:AndroidPackageFormat=apk -o "$GITHUB_WORKSPACE/out")
        if [ "$HAS_KEYSTORE" = "true" ]; then
          # As senhas vão por variável de ambiente (prefixo env:), nunca na linha de comando
          args+=(-p:AndroidKeyStore=true
                 -p:AndroidSigningKeyStore="$RUNNER_TEMP/monburan.keystore"
                 -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
                 -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
                 -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD)
        else
          echo "::warning::Sem keystore: APK assinado com a chave de debug do runner (só para conferência, não distribuir)."
        fi
        dotnet publish "$CSPROJ" "${args[@]}"
        ls -la "$GITHUB_WORKSPACE/out"

    - name: Conferir o pacote (versão e assinatura)
      id: apk
      env:
        VERSION_NAME: ${{ steps.version.outputs.name }}
        VERSION_CODE: ${{ steps.version.outputs.code }}
      run: |
        BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
        APK="$(find "$GITHUB_WORKSPACE/out" -maxdepth 1 -name '*-Signed.apk' | head -1)"
        if [ -z "$APK" ]; then
          echo "::error::Nenhum *-Signed.apk em out/ (o publish não gerou o APK assinado)"
          exit 1
        fi
        FINAL="$GITHUB_WORKSPACE/Monburan-v$VERSION_NAME.apk"
        cp "$APK" "$FINAL"

        badging="$("$BT/aapt2" dump badging "$FINAL" | grep -m1 '^package:')"
        echo "$badging"
        if ! { grep -q "versionName='$VERSION_NAME'" <<< "$badging" && grep -q "versionCode='$VERSION_CODE'" <<< "$badging"; }; then
          echo "::error::O APK não tem a versão do csproj ($VERSION_NAME / $VERSION_CODE)"
          exit 1
        fi
        if "$BT/aapt2" dump badging "$FINAL" | grep -q 'application-debuggable'; then
          echo "::error::O APK é debuggable"
          exit 1
        fi

        # Sem pipe: o status do apksigner decide (um pipe com tee/grep esconderia um "DOES NOT VERIFY")
        if ! "$BT/apksigner" verify --verbose --print-certs "$FINAL" > "$RUNNER_TEMP/certs.txt" 2>&1; then
          cat "$RUNNER_TEMP/certs.txt"
          echo "::error::A assinatura do APK não confere"
          exit 1
        fi
        cat "$RUNNER_TEMP/certs.txt"
        # O formato da linha muda entre versões do build-tools ("Signer #1 certificate ..." ou "Signer (minSdkVersion=...) certificate ...")
        cert="$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')"
        if [ -z "$cert" ]; then
          echo "::error::Não consegui ler o certificado de assinatura na saída do apksigner (acima)"
          exit 1
        fi
        {
          echo "path=$FINAL"
          echo "cert=$cert"
          echo "sha256=$(sha256sum "$FINAL" | awk '{print $1}')"
          echo "bt=$BT"
        } >> "$GITHUB_OUTPUT"

    # A release anterior pode ter sido assinada com outra chave (as primeiras saíram com a chave de
    # debug de um computador): nesse caso o Android não atualiza por cima e o usuário precisa desinstalar.
    - name: Comparar a assinatura com a release anterior
      id: signature
      env:
        GH_TOKEN: ${{ github.token }}
        NEW_CERT: ${{ steps.apk.outputs.cert }}
        BT: ${{ steps.apk.outputs.bt }}
      run: |
        same=unknown
        prev_tag="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)"
        if [ -n "$prev_tag" ]; then
          mkdir -p prev
          if gh release download "$prev_tag" --pattern '*.apk' --dir prev > /dev/null 2>&1 && ls prev/*.apk > /dev/null 2>&1; then
            prev_cert="$("$BT/apksigner" verify --print-certs prev/*.apk | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}' || true)"
            # Certificado ilegível nunca conta como "mesma assinatura"
            if [ -z "$prev_cert" ] || [ -z "$NEW_CERT" ]; then
              same=unknown
            elif [ "$prev_cert" = "$NEW_CERT" ]; then
              same=true
            else
              same=false
            fi
            echo "Release anterior: $prev_tag (certificado ${prev_cert:-ilegível}); APK novo: ${NEW_CERT:-ilegível}"
          fi
        fi
        echo "Mesma assinatura da release anterior: $same"
        echo "same=$same" >> "$GITHUB_OUTPUT"

    - name: Montar as notas da release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION_NAME: ${{ steps.version.outputs.name }}
        SAME: ${{ steps.signature.outputs.same }}
        SHA256: ${{ steps.apk.outputs.sha256 }}
        CERT: ${{ steps.apk.outputs.cert }}
      run: |
        tag="v$VERSION_NAME"
        case "$SAME" in
          true)  install_line="Instale por cima da versão anterior: a assinatura é a mesma." ;;
          false) install_line="**Desinstale a versão anterior antes de instalar:** esta versão foi assinada com outra chave e o Android não atualiza por cima." ;;
          *)     install_line="Se já houver uma versão instalada e o Android recusar a atualização, desinstale-a antes." ;;
        esac
        {
          echo "## Monburan $tag"
          echo
          echo "APK de instalação direta, gerado e assinado automaticamente pela esteira a partir da \`main\` (commit \`${GITHUB_SHA::7}\`)."
          echo
          echo "### Instalação"
          echo "1. $install_line"
          echo "2. Baixe o APK abaixo e abra no aparelho (autorize a instalação de fontes desconhecidas se o Android pedir)."
          echo
          echo "### Integridade"
          echo "- SHA-256 do APK: \`$SHA256\`"
          echo "- Certificado de assinatura (SHA-256): \`$CERT\`"
          echo
        } > release-notes.md
        # "O que mudou" gerado pelo GitHub a partir dos PRs desde a release anterior (opcional)
        prev_tag="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)"
        extra="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" ${prev_tag:+-f previous_tag_name="$prev_tag"} --jq .body 2>/dev/null || true)"
        [ -n "$extra" ] && printf '%s\n' "$extra" >> release-notes.md
        cat release-notes.md
        {
          echo "### APK $tag"
          echo
          cat release-notes.md
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: monburan-apk-v${{ steps.version.outputs.name }}
        path: ${{ steps.apk.outputs.path }}
        retention-days: 30
        if-no-files-found: error

    - name: Publicar a release
      if: env.PUBLISHING == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION_NAME: ${{ steps.version.outputs.name }}
        APK_PATH: ${{ steps.apk.outputs.path }}
      run: |
        tag="v$VERSION_NAME"
        if gh release view "$tag" > /dev/null 2>&1; then
          echo "::notice::A release $tag já existe; o APK não foi republicado. Para lançar uma nova versão, suba ApplicationDisplayVersion/ApplicationVersion no csproj."
          exit 0
        fi
        gh release create "$tag" "$APK_PATH" --target "$GITHUB_SHA" --title "Monburan $tag" --notes-file release-notes.md
        echo "Release $tag publicada."
