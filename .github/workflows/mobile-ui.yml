name: Mobile UI (Appium)

# Testes de tela do app Android em emulador (Appium + UiAutomator2 + xUnit): login, sessão, vagas.
# Como o E2E do site, só roda em PR para a MAIN (promoção dev→main) e em disparo manual: um emulador no runner
# custa vários minutos e o mesmo código já passou pelos testes rápidos na dev.
# Falhar aqui aparece no PR, mas não trava build, scan nem APK.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  API_URL: http://127.0.0.1:5095

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monburan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monburan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'NuGet.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android --version 10.0.402

    - name: Build API, APK (Debug) and tests
      run: |
        dotnet build src/Monburan.Web/Monburan.Web.csproj --configuration Release
        # Debug: o app aponta para http://127.0.0.1:5095 e a WebView fica depurável (o Appium entra nela).
        # EmbedAssembliesIntoApk deixa o APK autocontido, sem o fast deployment do Debug.
        dotnet build src/Monburan.Mobile/Monburan.Mobile.csproj -f net10.0-android --configuration Debug -p:EmbedAssembliesIntoApk=true
        dotnet build tests/Monburan.MobileUiTests/Monburan.MobileUiTests.csproj --configuration Release
        apk="$(find src/Monburan.Mobile/bin/Debug -name '*-Signed.apk' | head -n 1)"
        test -n "$apk" || { echo "::error::APK Debug não encontrado"; exit 1; }
        echo "MOBILE_APK=$GITHUB_WORKSPACE/$apk" >> "$GITHUB_ENV"

    - name: Start API (Development + Postgres do serviço)
      run: |
        ASPNETCORE_ENVIRONMENT=Development APPLY_MIGRATIONS=true \
        ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=monburan;Username=postgres;Password=postgres" \
        nohup dotnet run --project src/Monburan.Web/Monburan.Web.csproj --configuration Release \
          --no-build --no-launch-profile --urls "$API_URL" > app.log 2>&1 &
        for _ in $(seq 1 60); do
          if curl -fsS "$API_URL/health" > /dev/null 2>&1; then
            echo "API no ar"
            exit 0
          fi
          sleep 2
        done
        echo "::error::A API não respondeu em /health em 2 minutos"
        tail -n 60 app.log
        exit 1

    - name: Start Appium
      run: |
        # Versões fixas: o driver uiautomator2 mais novo exige o Appium 4 (beta), incompatível com o servidor 2.x
        npm install --global appium@3.9.0
        appium driver install uiautomator2@8.7.3
        nohup appium --allow-insecure=uiautomator2:chromedriver_autodownload --log appium.log > /dev/null 2>&1 &
        for _ in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:4723/status > /dev/null 2>&1; then
            echo "Appium no ar"
            exit 0
          fi
          sleep 2
        done
        echo "::error::O Appium não respondeu em /status"
        tail -n 60 appium.log
        exit 1

    # O emulador x86_64 precisa de KVM, que o runner só libera com esta regra
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run UI tests on the emulator
      uses: reactivecircus/android-emulator-runner@v2
      env:
        MOBILE_UI: '1'
        MOBILE_DIAG_DIR: ${{ runner.temp }}/diag
        MOBILE_SHOTS_DIR: ${{ runner.temp }}/shots
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        script: |
          adb reverse tcp:5095 tcp:5095
          adb install -r "$MOBILE_APK"
          adb shell monkey -p com.monburan.app -c android.intent.category.LAUNCHER 1
          sleep 45
          adb shell am force-stop com.monburan.app
          dotnet test tests/Monburan.MobileUiTests/Monburan.MobileUiTests.csproj --configuration Release --no-build --verbosity normal --results-directory "$RUNNER_TEMP/trx" --logger "trx;LogFileName=Monburan.MobileUiTests.trx"

    # Telas do app capturadas pelos próprios testes (evidência dos passos aprovados)
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mobile-ui-screenshots
        path: ${{ runner.temp }}/shots/*.png
        retention-days: 14
        if-no-files-found: warn

    - name: Upload logs and test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mobile-ui-logs
        path: |
          app.log
          appium.log
          ${{ runner.temp }}/trx/*.trx
          ${{ runner.temp }}/diag/*.png
        retention-days: 7
        if-no-files-found: warn
