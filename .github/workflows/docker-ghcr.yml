name: Build & Push Docker (GHCR)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'infra/vps/**'
      - '.github/workflows/docker-ghcr.yml'
  workflow_dispatch:

# Dois pushes seguidos na main não podem inverter a ordem: o build mais novo é o último a publicar o `latest`
concurrency:
  group: docker-ghcr
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Login no GHCR usando o GITHUB_TOKEN (escopo packages:write via `permissions`)
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags e labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Só a main publica: em disparo manual de outra branch o workflow apenas constrói a imagem, sem enviá-la
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Monburan.Web/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publicou a imagem na main, atualiza a VPS na sequência: envia infra/vps e roda o deploy.sh
  # (backup, tag de rollback, pull da imagem e espera do /health). Só roda depois que o push terminou.
  deploy-vps:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://monburan.com.br
    permissions:
      contents: read
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # Sem rsync na VPS: tar pelo próprio SSH. .env, chaves de IA, backup e backups ficam intactos.
      - name: Enviar infra/vps para /opt/monburan
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          tar -C infra/vps -czf - \
            --exclude=.env --exclude=ai-keys.env --exclude=backup.env --exclude=backups . \
            | ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
                'tar -xzf - -C /opt/monburan'

      - name: Deploy na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/monburan && bash deploy.sh'
