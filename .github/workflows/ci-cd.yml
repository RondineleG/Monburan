name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: 'monburan-webapp'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Install MAUI Android workload
      run: dotnet workload install maui-android
      
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build project
      run: dotnet build --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings
      
    - name: Generate code coverage report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:html
      continue-on-error: true
      
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report
      continue-on-error: true
      
    - name: Publish application
      run: dotnet publish src/Monburan.Web/Monburan.Web.csproj --configuration Release --output ./publish --no-build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: monburan-app
        path: ./publish
        retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security scan
      uses: github/super-linter@v5
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Check for secrets
      run: |
        if [ -n "$(git log --all --full-history -S "password" --oneline)" ]; then
          echo "Potential secrets found in git history"
          exit 1
        fi

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.monburan.com
    env:
      # O app falha no boot sem Jwt__SigningKey (ValidateOnStart). Com
      # AZURE_CREDENTIALS + AZURE_RESOURCE_GROUP o pipeline provisiona (secret
      # JWT_SIGNING_KEY) ou ao menos verifica que o app setting já existe;
      # sem credenciais o job falha ANTES de deployar uma app quebrada.
      HAS_AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS != '' && vars.AZURE_RESOURCE_GROUP != '' }}
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: monburan-app
        
    - name: Provision/verify Jwt__SigningKey no App Service
      if: env.HAS_AZURE_CREDS == 'true'
      uses: azure/CLI@v2
      env:
        AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      with:
        inlineScript: |
          APP_NAME="${{ env.AZURE_WEBAPP_NAME }}-staging"
          if [ -n "$JWT_SIGNING_KEY" ]; then
            az webapp config appsettings set \
              --name "$APP_NAME" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --settings "Jwt__SigningKey=$JWT_SIGNING_KEY" --output none
            echo "Jwt__SigningKey provisionado a partir do secret JWT_SIGNING_KEY"
          else
            # Sem secret: exige que o setting já exista (provisionado manualmente)
            az webapp config appsettings list \
              --name "$APP_NAME" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='Jwt__SigningKey' && value != ''].name" -o tsv \
              | grep -q Jwt__SigningKey || { \
                echo "::error::Jwt__SigningKey ausente no App Service e sem secret JWT_SIGNING_KEY para provisionar. Defina manualmente: az webapp config appsettings set -g <rg> -n $APP_NAME --settings Jwt__SigningKey=\$(openssl rand -base64 48)"; exit 1; }
            echo "Jwt__SigningKey já configurado no App Service"
          fi
          
    - name: Bloquear deploy sem como provisionar/verificar Jwt__SigningKey
      if: env.HAS_AZURE_CREDS != 'true'
      run: |
        echo "::error::Sem AZURE_CREDENTIALS + AZURE_RESOURCE_GROUP não é possível garantir Jwt__SigningKey no App Service — o app cairia no boot (ValidateOnStart). Configure as credenciais ou documente a provisão manual antes de habilitar este job."
        exit 1
        
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}-staging
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        package: .

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://monburan.com
    env:
      # Mesma garantia do staging — app não sobe sem Jwt__SigningKey
      HAS_AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS != '' && vars.AZURE_RESOURCE_GROUP != '' }}
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: monburan-app
        
    - name: Provision/verify Jwt__SigningKey no App Service
      if: env.HAS_AZURE_CREDS == 'true'
      uses: azure/CLI@v2
      env:
        AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      with:
        inlineScript: |
          APP_NAME="${{ env.AZURE_WEBAPP_NAME }}"
          if [ -n "$JWT_SIGNING_KEY" ]; then
            az webapp config appsettings set \
              --name "$APP_NAME" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --settings "Jwt__SigningKey=$JWT_SIGNING_KEY" --output none
            echo "Jwt__SigningKey provisionado a partir do secret JWT_SIGNING_KEY"
          else
            az webapp config appsettings list \
              --name "$APP_NAME" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='Jwt__SigningKey' && value != ''].name" -o tsv \
              | grep -q Jwt__SigningKey || { \
                echo "::error::Jwt__SigningKey ausente no App Service e sem secret JWT_SIGNING_KEY para provisionar. Defina manualmente: az webapp config appsettings set -g <rg> -n $APP_NAME --settings Jwt__SigningKey=\$(openssl rand -base64 48)"; exit 1; }
            echo "Jwt__SigningKey já configurado no App Service"
          fi
          
    - name: Bloquear deploy sem como provisionar/verificar Jwt__SigningKey
      if: env.HAS_AZURE_CREDS != 'true'
      run: |
        echo "::error::Sem AZURE_CREDENTIALS + AZURE_RESOURCE_GROUP não é possível garantir Jwt__SigningKey no App Service — o app cairia no boot (ValidateOnStart). Configure as credenciais ou documente a provisão manual antes de habilitar este job."
        exit 1
        
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .
        
    - name: Run database migrations
      run: |
        # Add migration command here
        echo "Running database migrations"
        
    - name: Health check
      run: |
        # Wait for deployment to complete
        sleep 30
        # Check health endpoint
        curl -f https://monburan.com.br/health || exit 1

  android-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      # 'secrets' não é permitido em step `if:` — expõe como env no nível do job
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install MAUI Android workload
      run: dotnet workload install maui-android
      
    - name: Build Android APK (debug)
      run: dotnet build src/Monburan.Mobile/Monburan.Mobile.csproj -f net10.0-android -c Debug -p:EmbedAssembliesIntoApk=true
      
    # Um único publish Release assinado — sem keystore o AAB sairia não-assinado e
    # o glob de artifacts pularia silenciosamente
    - name: Publish + sign Android AAB (release)
      if: env.HAS_KEYSTORE == 'true'
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/monburan.keystore
        dotnet publish src/Monburan.Mobile/Monburan.Mobile.csproj -f net10.0-android -c Release \
          -p:AndroidSigningKeyStore=/tmp/monburan.keystore \
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}
        
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: monburan-android
        path: |
          src/Monburan.Mobile/bin/Debug/net10.0-android/*Signed.apk
          src/Monburan.Mobile/bin/Release/net10.0-android/*Signed.aab
        retention-days: 30
        if-no-files-found: ignore
