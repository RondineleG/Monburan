name: CI/CD Pipeline

# Validação proporcial à criticidade do evento:
#   - PR para dev  → build + testes (unit, integração/Testcontainers, API) + security scan; SEM E2E.
#   - Push na dev  → mesma validação rápida (segunda camada após o merge do PR); SEM E2E.
#   - PR para main → validação completa, com a suíte E2E (Playwright) além do resto.
#   - Push na main → build + testes + scan; o E2E já foi validado no PR dev→main.
# Este workflow só valida: não publica nada. O deploy de produção é a VPS, via imagem do GHCR,
# no docker-ghcr.yml, que só roda na main.
#
# Checks obrigatórios (Settings > Rules > Rulesets):
#   dev  — build-and-test, security-scan (e2e NÃO é obrigatório na dev)
#   main — build-and-test, e2e, security-scan, origem-do-pr (main-only-from-dev.yml),
#          Analyze (csharp), Analyze (javascript-typescript), Analyze (actions) (codeql.yml)
# Detalhes em .github/workflows/README.md.
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior; em main/dev a execução em andamento termina (só uma
# execução pendente é trocada pela mais nova)
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Cache do cache global do NuGet (~/.nuget/packages). A chave muda só quando os csproj ou o
    # NuGet.config mudam; o restore deixa de baixar pacotes já conhecidos entre execuções.
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'NuGet.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android --version 10.0.402

    - name: Testar a conferência do deploy antes do APK
      run: bash .github/scripts/tests/wait-for-server-deploy.sh

    - name: Testar os canais externos nas telas do app
      run: dotnet run --project tests/ux-mobile-preview/ux-mobile-preview.csproj --configuration Release -- --verify-external-applications

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    # Monburan.E2ETests precisa do app no ar com Postgres e navegador: roda no job "e2e".
    # Roda os três projetos mesmo se um falhar, para o log mostrar tudo de uma vez.
    # Cada projeto grava seu TRX em $RUNNER_TEMP/trx (arquivo nomeado por projeto); o upload lê desse diretório.
    # Monburan.IntegrationTests usa Testcontainers (Postgres 16 real por classe de teste): o runner
    # ubuntu-latest já traz o Docker Engine instalado, então nenhum serviço/contêiner extra é necessário
    # aqui — o docker daemon do host basta para o Testcontainers subir seus contêineres.
    - name: Run tests (unit, integration e API)
      run: |
        rc=0
        for project in UnitTests IntegrationTests ApiTests; do
          dotnet test "tests/Monburan.$project" --configuration Release --no-build --verbosity normal \
            --results-directory "$RUNNER_TEMP/trx" \
            --logger "trx;LogFileName=Monburan.$project.trx" \
            --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings || rc=1
        done
        exit $rc

    - name: Generate code coverage report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:"$RUNNER_TEMP/trx/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:html
      continue-on-error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage-report
      continue-on-error: true

    # Resultados brutos dos testes (TRX): falha no step não impede o upload, então o diagnóstico
    # de cada teste reprovado fica disponível no run.
    - name: Upload test results (TRX)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-trx
        path: ${{ runner.temp }}/trx/*.trx
        retention-days: 7
        if-no-files-found: warn

  # Suíte Playwright (55 testes): sobe o app em Development (seed) contra um Postgres de serviço.
  # Independente dos demais jobs — falha aqui aparece no PR, mas não trava build, scan ou APK.
  # Só roda em PR para a MAIN (promoção dev→main, único caminho de entrada na produção) e em
  # dispatch manual. PRs para a dev e pushes dispensam o E2E: a suíte completa valeria o mesmo
  # código mais tarde no PR dev→main, e cada execução custa ~15 min de runner.
  # Nome do job preservado ("e2e") para não quebrar status checks já referenciados em rulesets.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monburan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monburan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_BASE_URL: http://localhost:5095

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'NuGet.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Build app and E2E tests
      run: |
        dotnet build src/Monburan.Web/Monburan.Web.csproj --configuration Release
        dotnet build tests/Monburan.E2ETests/Monburan.E2ETests.csproj --configuration Release

    - name: Install Playwright browser
      run: pwsh tests/Monburan.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Start app (Development + Postgres do serviço)
      run: |
        ASPNETCORE_ENVIRONMENT=Development APPLY_MIGRATIONS=true \
        ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=monburan;Username=postgres;Password=postgres" \
        nohup dotnet run --project src/Monburan.Web/Monburan.Web.csproj --configuration Release \
          --no-build --no-launch-profile --urls "$E2E_BASE_URL" > app.log 2>&1 &
        for _ in $(seq 1 60); do
          if curl -fsS "$E2E_BASE_URL/health" > /dev/null 2>&1; then
            echo "App no ar"
            exit 0
          fi
          sleep 2
        done
        echo "::error::O app não respondeu em /health em 2 minutos"
        tail -n 60 app.log
        exit 1

    # As varreduras já falharam de forma intermitente ao navegar enquanto a página de chegada negociava o circuito
    # Blazor (corrigido em FullSweepTests). A retentativa fica como proteção até a esteira acumular execuções verdes
    # sem ela; uma falha real repete.
    - name: Run E2E tests
      run: |
        for attempt in 1 2; do
          # Cada tentativa grava o próprio TRX: a repetição não apaga o diagnóstico da falha anterior
          if dotnet test tests/Monburan.E2ETests/Monburan.E2ETests.csproj --configuration Release --no-build --verbosity normal \
              --results-directory "$RUNNER_TEMP/trx" \
              --logger "trx;LogFileName=Monburan.E2ETests.attempt$attempt.trx"; then
            exit 0
          fi
          echo "::warning::E2E falhou na tentativa $attempt"
        done
        exit 1

    - name: Upload app log and test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-app-log
        path: |
          app.log
          ${{ runner.temp }}/trx/*.trx
        retention-days: 7
        if-no-files-found: warn

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Mesmo cache do build-and-test: o restore do scan de vulnerabilidades reusa os pacotes já baixados
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'NuGet.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    # Formatos de token/chave de alta confiança. A checagem anterior procurava a palavra "password"
    # no histórico, que existe em qualquer app com login — por isso sempre reprovava.
    - name: Check for secrets in tracked files
      run: |
        pattern='-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|\bre_[A-Za-z0-9]{24,}\b|eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{10,}'
        if git grep -nIE -e "$pattern" -- . ':!*.png' ':!*.jpg'; then
          echo "::error::Possível segredo versionado (linhas acima). Rotacione a credencial e remova-a do repositório."
          exit 1
        fi
        echo "Nenhum segredo de formato conhecido nos arquivos versionados."

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android --version 10.0.402

    - name: Restore dependencies
      run: dotnet restore Monburan.sln

    - name: Check NuGet packages for known vulnerabilities
      env:
        DOTNET_CLI_UI_LANGUAGE: en
      run: |
        dotnet list Monburan.sln package --vulnerable --include-transitive 2>&1 | tee vulnerabilities.txt
        if grep -q "has the following vulnerable packages" vulnerabilities.txt; then
          echo "::error::Há pacotes NuGet com vulnerabilidade conhecida (veja o log acima)."
          exit 1
        fi
