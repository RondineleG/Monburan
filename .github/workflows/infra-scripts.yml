name: Scripts da VPS

# Os scripts de infra/vps (endurecimento, backup, restauração e nginx) mexem em firewall, SSH e backup: um erro neles tranca
# você para fora do servidor ou deixa o backup inútil sem ninguém perceber. Por isso rodam de verdade em contêineres descartáveis.
# Só dispara quando algo de infra/vps muda.
on:
  push:
    branches: [ main, dev ]
    paths:
      - 'infra/vps/**'
      - '.github/workflows/infra-scripts.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'infra/vps/**'
      - '.github/workflows/infra-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-scripts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: ShellCheck
      run: |
        docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.10.0 -x \
          infra/vps/*.sh infra/vps/tests/*.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        script: [ harden-smoke, backup-restore-smoke, nginx-smoke ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run ${{ matrix.script }}
      run: bash infra/vps/tests/${{ matrix.script }}.sh
