name: CodeQL

# Análise estática de segurança (C#, JavaScript e os próprios workflows). Os alertas aparecem em Segurança > Code scanning.
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Toda segunda-feira, 03:23 em Brasília: pega alertas novos de regras atualizadas, mesmo sem mudança no código
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo PR cancela a análise anterior
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        language: [ csharp, javascript-typescript, actions ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # O global.json pede o SDK 10 (a análise do C# resolve os pacotes com ele)
    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Sem compilar (build-mode none): a solução inclui o app MAUI, que exigiria workloads de Android e iOS só para a análise
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: /language:${{ matrix.language }}
