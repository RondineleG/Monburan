<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0806" />
    <title>Monburan</title>
    <base href="/" />
    <!-- Sem Google Fonts: interface na fonte do sistema e a Cinzel do logotipo vem de fonts/ (app.css) -->
    <link rel="preload" href="fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="Monburan.Mobile.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div id="app">
        <!-- Tela de abertura: fica até o Blazor montar o app (o conteúdo de #app é substituído) -->
        <div class="app-splash" role="status" aria-label="Carregando o Monburan">
            <svg class="app-splash__mark" viewBox="20 20 160 168" aria-hidden="true" focusable="false">
                <!-- "O Chamado" completo: penas com barbas, sino gravado e o mar. Só o sino balança -->
                <defs><linearGradient id="splash-bell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="brand-mark__stop1" /><stop offset=".35" class="brand-mark__stop2" /><stop offset=".62" class="brand-mark__stop3" /><stop offset="1" class="brand-mark__stop4" /></linearGradient></defs>
                <g transform="translate(76 128) rotate(-30)"><path class="brand-mark__vane" d="M0 -6 C-11 -20 -13 -52 0 -88 C11 -52 10 -20 0 -6 Z" /><path class="brand-mark__rachis" stroke-width="1.6" d="M0 4 L0 -84" /><path class="brand-mark__rachis" stroke-width="1.3" d="M0 -26 L-8 -33 M0 -42 L-9.5 -50 M0 -58 L-7.5 -66 M0 -34 L8 -41 M0 -50 L8.5 -58 M0 -66 L5.5 -73" /></g>
                <g transform="translate(124 128) rotate(30)"><path class="brand-mark__vane" d="M0 -6 C-11 -20 -13 -52 0 -88 C11 -52 10 -20 0 -6 Z" /><path class="brand-mark__rachis" stroke-width="1.6" d="M0 4 L0 -84" /><path class="brand-mark__rachis" stroke-width="1.3" d="M0 -26 L-8 -33 M0 -42 L-9.5 -50 M0 -58 L-7.5 -66 M0 -34 L8 -41 M0 -50 L8.5 -58 M0 -66 L5.5 -73" /></g>
                <g class="brand-mark__bell" transform="translate(100 98) scale(1.22) translate(-100 -98)">
                    <path class="brand-mark__metal-line" stroke-width="3.2" d="M93 68 L93 63 C93 55 107 55 107 63 L107 68" />
                    <path fill="url(#splash-bell)" d="M84 75 C84 70 89 68 100 68 C111 68 116 70 116 75 L118 98 C119 110 124 117 133 121 L133 125 L67 125 L67 121 C76 117 81 110 82 98 Z" />
                    <path class="brand-mark__engrave" stroke-width="1" d="M83.6 80 L116.4 80 M83.2 84.5 L116.8 84.5 M80 110 L120 110 M76.5 116 L123.5 116" />
                    <path class="brand-mark__engrave" stroke-width="3" stroke-linecap="round" d="M93 91 L107 104 M107 91 L93 104" />
                    <path class="brand-mark__metal-line" stroke-width="3.4" stroke-linecap="round" d="M64 125.5 L136 125.5" />
                    <circle class="brand-mark__metal" cx="100" cy="133" r="4.4" />
                </g>
                <path class="brand-mark__metal-line" stroke-width="2" stroke-linecap="round" d="M44 168 C60 162 76 172 100 166 C124 160 140 172 156 166" />
                <path class="brand-mark__metal-line" stroke-width="1.2" stroke-linecap="round" opacity=".55" d="M58 176 C72 172 84 179 100 175 C116 171 128 179 142 176" />
            </svg>
            <p class="app-splash__name">Monburan</p>
            <p class="app-splash__tagline">palavra dada.</p>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <button type="button" class="dismiss" aria-label="Fechar aviso">×</button>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        window.monburan = {
            getTheme: function () {
                try { return localStorage.getItem('monburan-theme') || 'dark'; }
                catch (e) { return 'dark'; }
            },
            setTheme: function (theme) {
                try { localStorage.setItem('monburan-theme', theme); } catch (e) { }
            },
            applyTheme: function (theme) {
                document.documentElement.setAttribute('data-theme', theme);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#0A0806' : '#F2EBD9');
            }
        };
        // Aplica tema salvo antes do primeiro paint
        (function () {
            var theme = 'dark';
            try { theme = localStorage.getItem('monburan-theme') || 'dark'; } catch (e) { }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

</body>

</html>
